name: Deploy

"on":
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:
    inputs:
      port_run_id:
        description: "Run ID de Port"
        required: false
        type: string

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  PORT_BASE_URL: https://api.getport.io
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: ${{ github.event.repository.name }}
  APP_NAME: ${{ github.event.repository.name }}
  ENVIRONMENT: dev
  GITOPS_REPO: alvarolinarescabre/go-counter-href-10-sites

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:

      # ✅ Checkout del APP (sin repository: — ya estamos en el repo correcto)
      - name: Checkout application source
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # 1. Crear entidad deployment en Port → status: Building
      # ------------------------------------------------------------------
      - name: Port | crear deployment
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.PORT_CLIENT_ID }}
          clientSecret: ${{ secrets.PORT_CLIENT_SECRET }}
          baseUrl: ${{ env.PORT_BASE_URL }}
          operation: UPSERT
          identifier: ${{ github.event.repository.name }}-${{ github.run_id }}
          blueprint: deploymentRun
          title: "${{ github.event.repository.name }} @ ${{ github.sha }}"
          icon: Deployment
          properties: |-
            {
              "status": "Building",
              "environment": "${{ env.ENVIRONMENT }}",
              "commitSha": "${{ github.sha }}",
              "commitMessage": ${{ toJSON(github.event.head_commit.message) }},
              "author": "${{ github.actor }}",
              "branch": "${{ github.ref_name }}",
              "commitUrl": "${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}",
              "workflowRunUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "startedAt": "${{ github.event.head_commit.timestamp }}"
            }
          relations: |-
            {
              "service": "${{ github.event.repository.name }}",
              "argocdApplication": "${{ env.APP_NAME }}"
            }

      # ------------------------------------------------------------------
      # 2. Build + push → status: Image pushed
      # ------------------------------------------------------------------
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login en ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Componer URI de la imagen
        run: echo "IMAGE_REPO=${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_REPO }}:${{ github.sha }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Port | imagen publicada
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.PORT_CLIENT_ID }}
          clientSecret: ${{ secrets.PORT_CLIENT_SECRET }}
          baseUrl: ${{ env.PORT_BASE_URL }}
          operation: UPSERT
          identifier: ${{ github.event.repository.name }}-${{ github.run_id }}
          blueprint: deploymentRun
          properties: |-
            {
              "status": "Image pushed",
              "imageTag": "${{ env.IMAGE_REPO }}:${{ github.sha }}"
            }

      # ------------------------------------------------------------------
      # 3. Bump del tag en el repo GitOps → status: Manifest updated
      # ------------------------------------------------------------------
      - name: Actualizar manifiestos GitOps
        run: |
          set -euo pipefail
          git clone --depth 1 \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITOPS_REPO}.git" gitops
          cd gitops
          yq -i '.image.tag = "${{ github.sha }}"' "apps/${APP_NAME}/${ENVIRONMENT}/values.yaml"
          git -c user.name="port-ci" -c user.email="ci@example.com" \
            commit -am "chore(${APP_NAME}): bump a ${{ github.sha }}"
          git push

      # ... resto igual
