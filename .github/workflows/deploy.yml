# .github/workflows/deploy.yml
name: Deploy

"on":
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  # Permite además lanzarlo desde una Self-Service Action de Port
  workflow_dispatch:
    inputs:
      port_run_id:
        description: "Run ID de Port (lo inyecta Port automáticamente)"
        required: false
        type: string

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  # api.getport.io  (UE)  |  api.us.getport.io  (US)
  PORT_BASE_URL: https://api.getport.io
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: ${{ github.event.repository.name }}
  GITOPS_REPO: alvarolinarescabre/go-counter-href-10-sites
  APP_NAME: ${{ github.event.repository.name }}
  ENVIRONMENT: dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # necesario para el OIDC de AWS
    steps:
      - name: Checkout application source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          ref: ${{ github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------------------------
      # 1. Crear la entidad deployment en Port  ->  status: Building
      # ------------------------------------------------------------------
      - name: Port | crear deployment
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.PORT_CLIENT_ID }}
          clientSecret: ${{ secrets.PORT_CLIENT_SECRET }}
          baseUrl: ${{ env.PORT_BASE_URL }}
          operation: UPSERT
          identifier: ${{ github.event.repository.name }}-${{ github.run_id }}
          blueprint: deploymentRun
          title: "${{ github.event.repository.name }} @ ${{ github.sha }}"
          icon: Deployment
          properties: |-
            {
              "status": "Building",
              "environment": "${{ env.ENVIRONMENT }}",
              "commitSha": "${{ github.sha }}",
              "commitMessage": ${{ toJSON(github.event.head_commit.message) }},
              "author": "${{ github.actor }}",
              "branch": "${{ github.ref_name }}",
              "commitUrl": "${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}",
              "workflowRunUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "startedAt": "${{ github.event.head_commit.timestamp }}"
            }
          relations: |-
            {
              "service": "${{ github.event.repository.name }}",
              "argocdApplication": "${{ env.APP_NAME }}"
            }

      # ------------------------------------------------------------------
      # 2. Build + push de la imagen  ->  status: Image pushed
      # ------------------------------------------------------------------
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Login en ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # El registry (<account>.dkr.ecr.<region>.amazonaws.com) sale del login,
      # así que no hay que hardcodear el account ID en ningún sitio.
      - name: Componer URI de la imagen
        run: echo "IMAGE_REPO=${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}" >> "$GITHUB_ENV"

      # Descomenta si el repo de ECR no está creado por Terraform y quieres
      # que el pipeline lo cree la primera vez.
      # - name: Asegurar repositorio en ECR
      #   run: |
      #     aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" \
      #       || aws ecr create-repository --repository-name "$ECR_REPOSITORY" \
      #            --image-scanning-configuration scanOnPush=true \
      #            --image-tag-mutability IMMUTABLE

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Sin tag `latest`: con IMMUTABLE en ECR el push fallaría al reescribirlo,
          # y en GitOps el tag inmutable por SHA es justo lo que quieres.
          tags: ${{ env.IMAGE_REPO }}:${{ github.sha }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Port | imagen publicada
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.PORT_CLIENT_ID }}
          clientSecret: ${{ secrets.PORT_CLIENT_SECRET }}
          baseUrl: ${{ env.PORT_BASE_URL }}
          operation: UPSERT
          identifier: ${{ github.event.repository.name }}-${{ github.run_id }}
          blueprint: deploymentRun
          properties: |-
            {
              "status": "Image pushed",
              "imageTag": "${{ env.IMAGE_REPO }}:${{ github.sha }}"
            }

      # ------------------------------------------------------------------
      # 3. Bump del tag en el repo GitOps  ->  status: Manifest updated
      # ------------------------------------------------------------------
      - name: Actualizar manifiestos GitOps
        run: |
          set -euo pipefail
          git clone --depth 1 \
            "https://x-access-token:${{ secrets.GITOPS_TOKEN }}@github.com/${GITOPS_REPO}.git" gitops
          cd gitops
          yq -i '.image.tag = "${{ github.sha }}"' "apps/${APP_NAME}/${ENVIRONMENT}/values.yaml"
          git -c user.name="port-ci" -c user.email="ci@example.com" \
            commit -am "chore(${APP_NAME}): bump a ${{ github.sha }}"
          git push

      - name: Port | manifiestos actualizados
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.PORT_CLIENT_ID }}
          clientSecret: ${{ secrets.PORT_CLIENT_SECRET }}
          baseUrl: ${{ env.PORT_BASE_URL }}
          operation: UPSERT
          identifier: ${{ github.event.repository.name }}-${{ github.run_id }}
          blueprint: deploymentRun
          properties: '{"status": "Manifest updated"}'

      # ------------------------------------------------------------------
      # 4. Sync + wait en ArgoCD  ->  status: Syncing -> Deployed
      #    (si usas auto-sync, sustituye `app sync` por solo `app wait`)
      # ------------------------------------------------------------------
      - name: Instalar ArgoCD CLI
        run: |
          curl -sSL -o /tmp/argocd \
            https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          sudo install -m 555 /tmp/argocd /usr/local/bin/argocd

      - name: Port | sincronizando
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.PORT_CLIENT_ID }}
          clientSecret: ${{ secrets.PORT_CLIENT_SECRET }}
          baseUrl: ${{ env.PORT_BASE_URL }}
          operation: UPSERT
          identifier: ${{ github.event.repository.name }}-${{ github.run_id }}
          blueprint: deploymentRun
          properties: |-
            {
              "status": "Syncing",
              "argoAppUrl": "https://${{ secrets.ARGOCD_SERVER }}/applications/${{ env.APP_NAME }}-${{ env.ENVIRONMENT }}"
            }

      - name: ArgoCD sync + wait
        env:
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_TOKEN }}
        run: |
          set -euo pipefail
          APP="${APP_NAME}-${ENVIRONMENT}"
          argocd app sync "$APP" --grpc-web --timeout 300
          argocd app wait "$APP" --sync --health --grpc-web --timeout 600

      # ------------------------------------------------------------------
      # 5. Cierre  ->  Deployed / Failed
      # ------------------------------------------------------------------
      - name: Port | desplegado
        if: success()
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.PORT_CLIENT_ID }}
          clientSecret: ${{ secrets.PORT_CLIENT_SECRET }}
          baseUrl: ${{ env.PORT_BASE_URL }}
          operation: UPSERT
          identifier: ${{ github.event.repository.name }}-${{ github.run_id }}
          blueprint: deploymentRun
          properties: |-
            {
              "status": "Deployed",
              "finishedAt": "${{ github.event.repository.updated_at }}"
            }

      - name: Port | fallo
        if: failure()
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.PORT_CLIENT_ID }}
          clientSecret: ${{ secrets.PORT_CLIENT_SECRET }}
          baseUrl: ${{ env.PORT_BASE_URL }}
          operation: UPSERT
          identifier: ${{ github.event.repository.name }}-${{ github.run_id }}
          blueprint: deploymentRun
          properties: |-
            {
              "status": "Failed",
              "failureReason": "Fallo en el job ${{ github.job }} - revisa el run de GitHub Actions"
            }

      # Cierra el "run" de Port cuando el workflow se lanzó desde una
      # Self-Service Action (variante B del README).
      - name: Port | cerrar run de la self-service action
        if: always() && inputs.port_run_id != ''
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.PORT_CLIENT_ID }}
          clientSecret: ${{ secrets.PORT_CLIENT_SECRET }}
          baseUrl: ${{ env.PORT_BASE_URL }}
          operation: PATCH_RUN
          runId: ${{ inputs.port_run_id }}
          status: ${{ job.status == 'success' && 'SUCCESS' || 'FAILURE' }}
          logMessage: "Deploy finalizado con estado ${{ job.status }}"