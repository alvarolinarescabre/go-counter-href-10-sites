# .github/workflows/k6-load-test.yml
name: k6 Load Test

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'URL objetivo a testear'
        required: true
        type: string
      vus:
        description: 'Usuarios virtuales (VUs)'
        required: true
        default: '10'
        type: string
      duration:
        description: 'Duración del test (ej: 30s, 1m, 5m)'
        required: true
        default: '30s'
        type: string
      port_run_id:
        description: 'Port Run ID para reportar estado'
        required: false
        type: string
      port_entity_id:
        description: 'Identificador de la entidad loadTestRun en Port'
        required: false
        type: string

jobs:
  load-test:
    name: Run k6 Load Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ─── Instalar k6 (sin dirmngr / GPG keyserver) ──────────────────────────
      - name: Install k6
        run: |
          K6_VERSION="v0.54.0"
          curl -sL "https://github.com/grafana/k6/releases/download/${K6_VERSION}/k6-${K6_VERSION}-linux-amd64.tar.gz" \
            -o /tmp/k6.tar.gz
          tar -xzf /tmp/k6.tar.gz -C /tmp
          sudo mv /tmp/k6-${K6_VERSION}-linux-amd64/k6 /usr/local/bin/k6
          k6 version

      # ─── Script k6 inline ───────────────────────────────────────────────────
      - name: Create k6 test script
        run: |
          cat > /tmp/load-test.js << 'EOF'
          import http from 'k6/http';
          import { check, sleep } from 'k6';

          export const options = {
            vus:      __ENV.VUS      ? parseInt(__ENV.VUS)  : 10,
            duration: __ENV.DURATION || '30s',
            thresholds: {
              http_req_failed:   ['rate<0.10'],   // error rate < 10%
              http_req_duration: ['p(95)<2000'],  // p95 < 2s
            },
          };

          export default function () {
            const res = http.get(__ENV.TARGET_URL);
            check(res, {
              'status is 2xx': (r) => r.status >= 200 && r.status < 300,
            });
            sleep(1);
          }
          EOF

      # ─── Ejecutar k6 ────────────────────────────────────────────────────────
      - name: Run k6 load test
        id: k6_run
        continue-on-error: true
        run: |
          k6 run \
            --env VUS="${{ inputs.vus }}" \
            --env DURATION="${{ inputs.duration }}" \
            --env TARGET_URL="${{ inputs.target_url }}" \
            --summary-export=/tmp/k6-summary.json \
            /tmp/load-test.js

      # ─── Parsear métricas ────────────────────────────────────────────────────
      - name: Parse k6 results
        id: parse_results
        run: |
          SUMMARY=/tmp/k6-summary.json

          if [ ! -f "$SUMMARY" ]; then
            echo "avg_response_time=0" >> $GITHUB_OUTPUT
            echo "p95_response_time=0" >> $GITHUB_OUTPUT
            echo "p99_response_time=0" >> $GITHUB_OUTPUT
            echo "rps=0"               >> $GITHUB_OUTPUT
            echo "total_requests=0"    >> $GITHUB_OUTPUT
            echo "error_rate=100"      >> $GITHUB_OUTPUT
            exit 0
          fi

          AVG=$(jq   '(.metrics.http_req_duration.values.avg              // 0) * 100 | round / 100' "$SUMMARY")
          P95=$(jq   '(.metrics.http_req_duration.values["p(95)"]         // 0) * 100 | round / 100' "$SUMMARY")
          P99=$(jq   '(.metrics.http_req_duration.values["p(99)"]         // 0) * 100 | round / 100' "$SUMMARY")
          RPS=$(jq   '(.metrics.http_reqs.values.rate                     // 0) * 100 | round / 100' "$SUMMARY")
          TOTAL=$(jq '(.metrics.http_reqs.values.count                    // 0)'                      "$SUMMARY")
          ERROR=$(jq '(.metrics.http_req_failed.values.rate               // 0) * 10000 | round / 100' "$SUMMARY")

          echo "avg_response_time=$AVG"  >> $GITHUB_OUTPUT
          echo "p95_response_time=$P95"  >> $GITHUB_OUTPUT
          echo "p99_response_time=$P99"  >> $GITHUB_OUTPUT
          echo "rps=$RPS"                >> $GITHUB_OUTPUT
          echo "total_requests=$TOTAL"   >> $GITHUB_OUTPUT
          echo "error_rate=$ERROR"       >> $GITHUB_OUTPUT

      # ─── Determinar estado ───────────────────────────────────────────────────
      - name: Determine test status
        id: test_status
        run: |
          if [ "${{ steps.k6_run.outcome }}" == "success" ]; then
            echo "status=passed" >> $GITHUB_OUTPUT
          else
            echo "status=failed" >> $GITHUB_OUTPUT
          fi

      # ─── Token de Port ───────────────────────────────────────────────────────
      - name: Get Port access token
        id: port_token
        run: |
          TOKEN=$(curl -sf -X POST https://api.getport.io/v1/auth/access_token \
            -H "Content-Type: application/json" \
            -d "{\"clientId\":\"${{ secrets.PORT_CLIENT_ID }}\",\"clientSecret\":\"${{ secrets.PORT_CLIENT_SECRET }}\"}" \
            | jq -r '.accessToken')
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      # ─── Actualizar entidad en Port con métricas ─────────────────────────────
      - name: Update Port entity with results
        if: ${{ inputs.port_entity_id != '' }}
        run: |
          curl -sf -X PATCH \
            "https://api.getport.io/v1/blueprints/loadTestRun/entities/${{ inputs.port_entity_id }}" \
            -H "Authorization: Bearer ${{ steps.port_token.outputs.token }}" \
            -H "Content-Type: application/json" \
            -d '{
              "properties": {
                "status":               "${{ steps.test_status.outputs.status }}",
                "avg_response_time_ms":  ${{ steps.parse_results.outputs.avg_response_time }},
                "p95_response_time_ms":  ${{ steps.parse_results.outputs.p95_response_time }},
                "p99_response_time_ms":  ${{ steps.parse_results.outputs.p99_response_time }},
                "requests_per_second":   ${{ steps.parse_results.outputs.rps }},
                "total_requests":        ${{ steps.parse_results.outputs.total_requests }},
                "error_rate_percent":    ${{ steps.parse_results.outputs.error_rate }}
              }
            }'

      # ─── Subir artefacto ─────────────────────────────────────────────────────
      - name: Upload k6 summary artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-results-${{ github.run_id }}
          path: /tmp/k6-summary.json
          if-no-files-found: warn
