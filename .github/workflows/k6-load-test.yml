name: k6 Load Test

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "URL objetivo del test"
        required: true
        type: string
      vus:
        description: "Número de usuarios virtuales"
        required: true
        default: "10"
        type: string
      duration:
        description: "Duración del test (ej: 30s, 1m)"
        required: true
        default: "30s"
        type: string
      port_run_id:
        description: "Run ID de Port para reportar status"
        required: false
        type: string
      port_entity_id:
        description: "ID de la entidad en Port para actualizar resultados"
        required: false
        type: string

jobs:
  load-test:
    name: Run k6 Load Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update && sudo apt-get install k6 -y

      - name: Run k6 test
        id: k6
        env:
          TARGET_URL: ${{ inputs.target_url }}
          K6_VUS: ${{ inputs.vus }}
          K6_DURATION: ${{ inputs.duration }}
        run: |
          k6 run \
            --vus "$K6_VUS" \
            --duration "$K6_DURATION" \
            -e TARGET_URL="$TARGET_URL" \
            --summary-export=results.json \
            apps/counter-api/loadtest/k6.js
          echo "k6_exit=$?" >> $GITHUB_OUTPUT

      - name: Parse k6 results
        id: parse
        if: always()
        run: |
          # Extraer métricas del summary de k6
          AVG=$(jq '.metrics["http_req_duration"].values.avg // 0' results.json)
          P95=$(jq '.metrics["http_req_duration"].values["p(95)"] // 0' results.json)
          P99=$(jq '.metrics["http_req_duration"].values["p(99)"] // 0' results.json)
          RPS=$(jq '.metrics["http_reqs"].values.rate // 0' results.json)
          TOTAL=$(jq '.metrics["http_reqs"].values.count // 0' results.json)
          ERRORS=$(jq '
            if .metrics["http_req_failed"].values.rate then
              (.metrics["http_req_failed"].values.rate * 100 | round)
            else 0 end
          ' results.json)

          echo "avg_ms=$AVG" >> $GITHUB_OUTPUT
          echo "p95_ms=$P95" >> $GITHUB_OUTPUT
          echo "p99_ms=$P99" >> $GITHUB_OUTPUT
          echo "rps=$RPS" >> $GITHUB_OUTPUT
          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "errors=$ERRORS" >> $GITHUB_OUTPUT

      - name: Update Port entity with results
        if: always() && inputs.port_entity_id != ''
        env:
          PORT_CLIENT_ID: ${{ secrets.PORT_CLIENT_ID }}
          PORT_CLIENT_SECRET: ${{ secrets.PORT_CLIENT_SECRET }}
        run: |
          # Obtener token de Port
          TOKEN=$(curl -s -X POST https://api.getport.io/v1/auth/access_token \
            -H "Content-Type: application/json" \
            -d "{\"clientId\": \"$PORT_CLIENT_ID\", \"clientSecret\": \"$PORT_CLIENT_SECRET\"}" \
            | jq -r '.accessToken')

          STATUS="${{ steps.k6.outputs.k6_exit == '0' && 'passed' || 'failed' }}"

          # Actualizar entidad en Port con los resultados
          curl -s -X PATCH "https://api.getport.io/v1/blueprints/loadTestRun/entities/${{ inputs.port_entity_id }}" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "properties": {
                "status": "'"$STATUS"'",
                "avg_response_time_ms": ${{ steps.parse.outputs.avg_ms }},
                "p95_response_time_ms": ${{ steps.parse.outputs.p95_ms }},
                "p99_response_time_ms": ${{ steps.parse.outputs.p99_ms }},
                "requests_per_second": ${{ steps.parse.outputs.rps }},
                "total_requests": ${{ steps.parse.outputs.total }},
                "error_rate_percent": ${{ steps.parse.outputs.errors }}
              }
            }'
