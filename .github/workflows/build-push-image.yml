name: Build and push image

# Build the counter-api image and push it to ECR. Nothing else: no Port
# entity, no GitOps bump, no deployment. deploy.yml does the whole pipeline on
# every push to main; this one exists for when you just need an image in the
# registry -- typically after a `terraform destroy` recreated the repository
# (force_delete = true in infra/aws/07-ecr.tf takes the images with it) and the
# tag the cluster is already asking for no longer resolves.
#
# Dispatch it with `ref` set to the commit the running Deployment references
# and it republishes exactly that tag, with no git commit needed to recover.

"on":
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit, branch or tag to build. Empty = the branch you dispatch from."
        required: false
        type: string
      image_tag:
        description: "Image tag to push. Empty = the full 40-char sha of the built commit, which is what deploy.yml and the Helm values use."
        required: false
        type: string

# Shares deploy.yml's group on purpose: both push to the same IMMUTABLE
# repository, and a second push of a tag that is already there fails.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: ${{ github.event.repository.name }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # An empty `ref` input makes checkout fall back to the dispatch ref,
      # which is what you want when building the tip of a branch.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      # The input goes through the environment rather than into the script
      # text: a `${{ }}` expansion is pasted in before the shell ever runs, so
      # an input containing shell syntax would execute here.
      - name: Resolve tag
        env:
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          # github.sha is the dispatch ref's head, not the checked-out commit,
          # so read the commit back out of the working tree instead.
          sha="$(git rev-parse HEAD)"
          echo "IMAGE_TAG=${INPUT_IMAGE_TAG:-$sha}" >> "$GITHUB_ENV"
          echo "BUILT_SHA=${sha}" >> "$GITHUB_ENV"

      # The plain AWS_* secrets, same as deploy.yml: the ECR-push user, not the
      # TF_AWS_* Terraform users (see infra/aws/bootstrap/outputs.tf).
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compose image URI
        run: echo "IMAGE_REPO=${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}" >> "$GITHUB_ENV"

      # image_tag_mutability = "IMMUTABLE", so an existing tag would only fail
      # after a full build. Ten seconds here saves that.
      - name: Refuse to overwrite an existing tag
        run: |
          set -euo pipefail
          if aws ecr describe-images \
               --repository-name "${ECR_REPOSITORY}" \
               --image-ids "imageTag=${IMAGE_TAG}" >/dev/null 2>&1; then
            echo "::error::${IMAGE_REPO}:${IMAGE_TAG} already exists and the repository is IMMUTABLE. Nothing to do."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # linux/amd64 only, matching var.karpenter_node_architectures: Karpenter
      # provisions no arm64 nodes, so a multi-arch build would buy nothing.
      # provenance: false keeps the push a plain manifest -- an attestation
      # manifest list leaves an untagged child that rule 1 of the lifecycle
      # policy then expires out from under the image.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: apps/counter-api
          file: apps/counter-api/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Job summary
        run: |
          {
            echo "## Pushed"
            echo
            echo '```'
            echo "${IMAGE_REPO}:${IMAGE_TAG}"
            echo "built from ${BUILT_SHA}"
            echo '```'
            echo
            echo "To deploy it, set \`image.tag\` in \`deploy/helm/counter-api/values.yaml\`:"
            echo
            echo '```yaml'
            echo "  tag: ${IMAGE_TAG}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
