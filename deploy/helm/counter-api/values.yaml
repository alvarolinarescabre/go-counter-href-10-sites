# Fixed replica count, only used when autoscaling.enabled is false.
replicaCount: 24
# Autoscaling. The floor handles normal traffic and the ceiling matches the
# old fixed replicaCount. Which autoscaler is created depends on keda.enabled
# below; the bounds, the behavior and the CPU target are shared by both.
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 24
  # Utilization measured against resources.requests.cpu (100m). At 5000 rps
  # the pods used ~0.1 core each, so CPU sits near 100% of request across most
  # of the useful range -- a flat, late signal, which is the reason for the
  # request-rate trigger below.
  targetCPUUtilizationPercentage: 70
  # Scale up at once on a burst; scale down slowly so a dip between waves of
  # traffic does not throw away pods that are needed again a minute later.
  # Applied to the plain HPA and to the one KEDA generates alike, so flipping
  # keda.enabled does not silently change how the app reacts.
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
  # KEDA does not replace the HPA -- a ScaledObject creates one (keda-hpa-*)
  # and KEDA feeds it through the external metrics API. What it buys here is
  # scaling on the request rate the app actually serves instead of on CPU.
  # Needs var.enable_keda in infra/aws; with this on, templates/hpa.yaml is
  # not rendered, so the two can never fight over the same Deployment.
  keda:
    enabled: true
    # KEDA re-runs the query on this interval and serves the result from cache
    # to the HPA. Shorter than the 30s scrape below on purpose: it costs one
    # cheap query and means a fresh sample is acted on as soon as it lands.
    pollingInterval: 15
    prometheus:
      # VMSingle's Prometheus-compatible query API. Namespace follows
      # var.monitoring_namespace; the service name is the chart's release
      # name. Verify with:
      #   kubectl -n monitoring get svc vmsingle-victoria-metrics-k8s-stack
      serverAddress: http://vmsingle-victoria-metrics-k8s-stack.monitoring.svc:8428/prometheus
      # A 2m window over a 30s scrape interval (metrics.serviceScrape.interval)
      # is four samples, so the rate survives one missed scrape. At [1m] it is
      # two, and a single miss leaves the query with nothing to report.
      query: sum(rate(counter_api_http_requests_total[2m]))
      # Target requests per second per pod. The query returns the fleet total
      # and the HPA divides by the replica count. The load test served 5000 rps
      # on 24 pods, i.e. ~208 rps each: 210 makes that peak land exactly on
      # maxReplicas rather than permanently asking for one pod more than the
      # ceiling allows.
      threshold: "210"
revisionHistoryLimit: 2
# Zero-downtime rollouts: new pods must be Ready before an old one is removed,
# and a removed pod keeps serving until the gateway has stopped routing to it.
rollout:
  maxSurge: 25%
  maxUnavailable: 0
  preStopSleepSeconds: 10
  terminationGracePeriodSeconds: 30
podDisruptionBudget:
  enabled: true
  # Worth knowing what this does and does not cover: a PDB constrains voluntary
  # disruption -- drains, consolidation, rollouts. A spot reclaim is not
  # voluntary. AWS takes the instance after its two-minute notice whether or
  # not the budget allows the eviction, so the spread below is what actually
  # limits the blast radius, and this limits the churn on top of it.
  maxUnavailable: 25%
# Every node this runs on is spot (see var.karpenter_node_capacity_types). A
# spot reclaim takes a whole capacity pool -- instance type *and* AZ -- not one
# instance, so without a constraint the scheduler is free to put all three
# minimum replicas in one zone and lose them together. The kube-scheduler's
# built-in defaults do not save you here: they are maxSkew 3 by zone and 5 by
# hostname, which three replicas can satisfy while sitting in a single zone.
topologySpread:
  enabled: true
  constraints:
    # ScheduleAnyway, not DoNotSchedule: KEDA scales this to 24 pods and
    # Karpenter provisions the nodes to match. A hard constraint leaves pods
    # Pending when a zone has run out of spot capacity -- precisely the moment
    # scaling up matters most. A preference still steers every placement.
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
image:
  # Must match `terraform output ecr_repository_url` from infra/aws. Nodes pull
  # it with their own node IAM role, so there is no imagePullSecret.
  repository: 133630512259.dkr.ecr.eu-west-1.amazonaws.com/go-counter-href-10-sites
  tag: 278aa8756afbff647011ca969db546693a8574d5
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 80
gateway:
  enabled: true
  name: public-nlb-gateway
  namespace: default
  className: kgateway
  listenerName: http
  port: 80
  allowedRoutesFrom: All
  # Second listener fronted by the NLB's TLS port. The NLB terminates TLS with
  # the ACM certificate below and forwards plain HTTP to this port, so the
  # listener protocol is HTTP -- there is no certificate inside the cluster.
  # Requires gatewayParameters.tls.certificateArn.
  https:
    enabled: false
    listenerName: https
    port: 443
httpRoute:
  enabled: true
  gateway:
    name: public-nlb-gateway
    # Gateway listeners this route attaches to. Leave the list empty to attach
    # to every listener the Gateway exposes.
    sectionNames:
      - http
  # Leave empty (hostnames: []) to match any Host header, which lets you reach
  # the app straight on the Gateway's NLB DNS name with no domain of your own.
  # Only one hostname-less route can own "/" on a given Gateway listener.
  hostnames:
    - counter-api.alvarolinarescabre.com
  pathPrefix: /
gatewayParameters:
  enabled: true
  name: public-nlb-params
  extraAnnotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "external"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
    service.beta.kubernetes.io/aws-load-balancer-manage-backend-security-group-rules: "true"
  tls:
    # ARN of the ACM certificate the NLB serves on the TLS port(s) below. Must
    # live in the same region as the cluster and cover the httpRoute hostnames.
    # Setting this adds the aws-load-balancer-ssl-* annotations; it is required
    # by gateway.https.enabled.
    # TODO: Create ACM certificate and update this ARN, then set gateway.https.enabled: true
    certificateArn: ""
    # Frontend ports that terminate TLS. Everything else stays plain HTTP.
    ports: "443"
    negotiationPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
  # The Envoy proxy kgateway runs for the Gateway. In the 5000 rps test it was
  # the busiest component (~0.85 core) and ran as a single replica.
  proxy:
    resources:
      # No CPU limit: throttling a proxy adds latency to every request.
      requests:
        cpu: 500m
        memory: 128Mi
      limits:
        memory: 512Mi
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
      # Lower than the app's 70%: a new proxy replica takes a while to start
      # and join the NLB, so it has to be requested before the pods are hot.
      targetCPUUtilizationPercentage: 50
    # Keep the proxy off the managed system nodes (burstable t3, shared with
    # Argo CD, Karpenter, CoreDNS...): in the 5000 rps test the replicas that
    # landed there drove p99 from ~10ms to ~70ms.
    nodeSelector:
      karpenter.sh/nodepool: default
    podDisruptionBudget:
      minAvailable: 1
    gracefulShutdownSeconds: 10
metrics:
  # Serve Prometheus metrics on their own port (never routed by the Gateway).
  enabled: true
  port: 9090
  # VMServiceScrape so the VictoriaMetrics vmagent scrapes this app. Only
  # rendered once the operator's CRD exists in the cluster, so the chart still
  # syncs on a cluster without the monitoring stack.
  serviceScrape:
    enabled: true
    interval: 30s
# kgateway policies for traffic from the Gateway proxy to the app.
gatewayPolicies:
  # Must stay below the app's http.Server IdleTimeout (60s).
  upstreamIdleTimeout: 30s
  retry:
    enabled: true
    attempts: 2
    retryOn:
      - reset
      - connect-failure
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
