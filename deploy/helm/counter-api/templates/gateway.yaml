{{- if .Values.gateway.enabled }}
{{- if and .Values.gateway.https.enabled (not .Values.gatewayParameters.tls.certificateArn) }}
{{- fail "gateway.https.enabled needs gatewayParameters.tls.certificateArn: the NLB terminates TLS, so without an ACM certificate the 443 listener would serve plain HTTP." }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gateway.name }}
  labels:
    {{- include "counter-api.labels" . | nindent 4 }}
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  {{- if .Values.gatewayParameters.enabled }}
  infrastructure:
    parametersRef:
      group: gateway.kgateway.dev
      kind: GatewayParameters
      name: {{ .Values.gatewayParameters.name }}
  {{- end }}
  listeners:
    - name: {{ .Values.gateway.listenerName }}
      protocol: HTTP
      port: {{ .Values.gateway.port }}
      allowedRoutes:
        namespaces:
          from: {{ .Values.gateway.allowedRoutesFrom }}
    {{- if .Values.gateway.https.enabled }}
    {{- /*
      protocol is HTTP, not HTTPS, and there is no `tls:` block on purpose: the
      NLB terminates TLS with the ACM certificate and forwards the decrypted
      stream to this port, so the Gateway never sees a TLS handshake.
    */}}
    - name: {{ .Values.gateway.https.listenerName }}
      protocol: HTTP
      port: {{ .Values.gateway.https.port }}
      allowedRoutes:
        namespaces:
          from: {{ .Values.gateway.allowedRoutesFrom }}
    {{- end }}
{{- end }}