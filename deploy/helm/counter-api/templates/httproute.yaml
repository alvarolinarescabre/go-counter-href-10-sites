{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "counter-api.fullname" . }}
  labels:
    {{- include "counter-api.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- if .Values.httpRoute.gateway.sectionNames }}
    {{- range .Values.httpRoute.gateway.sectionNames }}
    - name: {{ $.Values.httpRoute.gateway.name }}
      sectionName: {{ . }}
    {{- end }}
    {{- else }}
    {{- /* No sectionName at all: attach to every listener on the Gateway. */}}
    - name: {{ .Values.httpRoute.gateway.name }}
    {{- end }}
  {{- with .Values.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.httpRoute.pathPrefix | quote }}
      backendRefs:
        - name: {{ include "counter-api.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}